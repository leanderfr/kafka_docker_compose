

version: '3.8'

services:
  # Broker Kafka configurado em modo KRaft
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://leander.vps-kinghost.net:9092' 


      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'


  # Confluent REST Proxy
  rest-proxy:
    image: confluentinc/cp-kafka-rest:7.5.0
    container_name: rest-proxy
    depends_on:
      - kafka
    ports:
      - "8082:8082"
    volumes:
      # Mapeia o keystore da sua máquina local para dentro do container
      - ./secrets:/etc/kafka/secrets      

    environment:
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_LISTENERS: "https://0.0.0.0:8082"

      # the file '.p12', needed to make kafka proxy running over HTTPS, can be extracted out of the Kinghost provided certificate
      # to do this, use the command tip below:
      # ************************************************************************************************
      #     openssl pkcs12 -export -in cert.pem -inkey privkey.pem -out abc.p12
      # ************************************************************************************************
      # by the way, it took me 10 hours of search and tries to get to this line

      KAFKA_REST_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/abc.p12
      KAFKA_REST_SSL_KEYSTORE_PASSWORD: "123456"
      KAFKA_REST_SSL_KEY_PASSWORD: "123456"
      KAFKA_REST_SSL_KEYSTORE_TYPE: "JKS"      

      # Aponta para o nome do container do Kafka na rede interna do Docker
      KAFKA_REST_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:29092"
      # Configuração do CORS:
      KAFKA_REST_ACCESS_CONTROL_ALLOW_ORIGIN: '*'
      KAFKA_REST_ACCESS_CONTROL_ALLOW_METHODS: 'GET,POST,PUT,DELETE,OPTIONS,HEAD'
      KAFKA_REST_ACCESS_CONTROL_ALLOW_HEADERS: 'Origin,Content-Type,Accept,Authorization'      